# test-gate -- GENERATED by Development _ob/scripts/sync-repo-standards.ts.
# Enforces the functional test rules on every PR (development#1239): test
# budget, no tests named after an issue or finding, no coverage config.
# Refresh: _ob/bin/sync-repo-standards <repo>. Rule changes belong in
# Development's _ob/scripts/test-gate.ts, never in this repo's copy.
name: test-gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  test-gate:
    runs-on: forgejo-mvp
    container: node:24-bookworm
    timeout-minutes: 5
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: node _githooks/test-gate.ts --range "origin/$BASE_REF" HEAD
